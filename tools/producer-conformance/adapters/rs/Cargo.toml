[package]
name = "ontos-producer-adapter"
version = "0.0.0"
description = "producer-conformance adapter (rs): builds a host value natively from a recipe, runs the blessed producer, reports canonical bytes or a classified rejection. Maintainer tooling; never published."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ontos-producer-adapter"
path = "src/main.rs"

[dependencies]
ontos-core = { package = "bitspark-ontos-core", version = "0.14.0", path = "../../../../core/rs" }
ontos-codec = { package = "bitspark-ontos-codec", version = "0.14.0", path = "../../../../codec/rs" }
ontos-data = { package = "bitspark-ontos-data", version = "0.14.0", path = "../../../../data/rs" }
